<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Archeryhub Entry Landing Screen</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#d9ff00",
                        "background-light": "#f8f8f5",
                        "background-dark": "#20230f",
                        "surface-light": "#ffffff",
                        "surface-dark": "#2a2e15",
                        "text-primary-light": "#1a1d0c",
                        "text-primary-dark": "#f2f4e6",
                        "text-secondary-light": "#585e45",
                        "text-secondary-dark": "#cdd1be",
                    },
                    fontFamily: {
                        "display": ["Sora", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                    backgroundImage: {
                        'grid-pattern': "url(\"data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%239C92AC' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E\")",
                    }
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hide for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-text-primary-light dark:text-text-primary-dark antialiased h-screen w-full overflow-hidden flex flex-col justify-between selection:bg-primary selection:text-black">
<!-- Header / Logo Area -->
<div class="flex-1 flex flex-col items-center justify-center p-6 pt-12 relative z-10">
<div class="w-full max-w-xs flex flex-col items-center gap-6">
<!-- Logo Placeholder -->
<div class="w-32 h-32 rounded-2xl bg-gradient-to-br from-primary/80 to-primary flex items-center justify-center shadow-lg shadow-primary/20 mb-4" data-alt="Archeryhub logo with abstract target rings">
<span class="material-symbols-outlined text-black text-6xl">
                    target
                </span>
</div>
<h1 class="text-3xl font-bold tracking-tight text-center text-text-primary-light dark:text-text-primary-dark">
                Archeryhub<span class="text-primary-light/50 dark:text-primary">.id</span>
</h1>
<p class="text-text-secondary-light dark:text-text-secondary-dark text-center text-sm font-medium opacity-80">
                Official Scoring System
            </p>
</div>
</div>
<!-- Main Actions Area -->
<div class="w-full max-w-md mx-auto px-6 pb-8 relative z-20 flex flex-col gap-4">
<!-- Primary Action: Scan Barcode -->
<button class="group relative w-full h-16 bg-primary hover:bg-[#ccee00] active:scale-[0.98] transition-all duration-200 rounded-xl flex items-center justify-center gap-3 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-black text-2xl group-hover:rotate-12 transition-transform duration-300">
                qr_code_scanner
            </span>
<span class="text-black text-lg font-bold tracking-wide">
                Scan Barcode Bantalan
            </span>
<!-- Subtle glow effect -->
<div class="absolute inset-0 rounded-xl bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity duration-200"></div>
</button>
<!-- Secondary Action: Manual Input -->
<button class="group w-full h-16 bg-surface-light dark:bg-surface-dark border-2 border-text-secondary-light/20 dark:border-text-secondary-dark/20 hover:border-primary active:scale-[0.98] transition-all duration-200 rounded-xl flex items-center justify-center gap-3 shadow-sm">
<span class="material-symbols-outlined text-text-primary-light dark:text-text-primary-dark text-2xl group-hover:text-primary transition-colors duration-200">
                keyboard
            </span>
<span class="text-text-primary-light dark:text-text-primary-dark text-lg font-bold tracking-wide group-hover:text-primary-dark dark:group-hover:text-primary transition-colors duration-200">
                Input Kode Manual
            </span>
</button>
<!-- Spacer for visual balance -->
<div class="h-4"></div>
<!-- Footer Help Text -->
<div class="w-full text-center pb-8">
<a class="inline-flex items-center gap-1.5 text-text-secondary-light dark:text-text-secondary-dark hover:text-primary-dark dark:hover:text-primary text-sm font-medium transition-colors border-b border-transparent hover:border-current pb-0.5" href="#">
<span class="material-symbols-outlined text-base">help</span>
                Butuh bantuan? Hubungi Panitia
            </a>
</div>
</div>
<!-- Background Decoration (Fixed to bottom) -->
<div class="absolute bottom-0 left-0 right-0 h-1/3 z-0 pointer-events-none overflow-hidden">
<!-- Geometric Circles simulating target rings -->
<div class="absolute -bottom-24 -right-24 w-80 h-80 rounded-full border-[32px] border-text-secondary-light/5 dark:border-text-secondary-dark/5"></div>
<div class="absolute -bottom-12 -right-12 w-48 h-48 rounded-full border-[24px] border-primary/10 dark:border-primary/5"></div>
<!-- Subtle Grid Texture -->
<div class="absolute inset-0 bg-grid-pattern opacity-30 dark:opacity-10 [mask-image:linear-gradient(to_top,black,transparent)]"></div>
<!-- Gradient overlay to fade it out -->
<div class="absolute inset-0 bg-gradient-to-t from-background-light dark:from-background-dark via-transparent to-transparent"></div>
</div>
</body></html>
